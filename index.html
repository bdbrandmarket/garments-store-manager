<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Brand Market — Garments Factory</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<div id="toast" class="toast"></div>

<header class="topbar">
  <button class="icon-btn" id="menuBtn">☰</button>
  <div class="brand-title">
    <strong>Dashboard</strong>
    <small>BD Brand Market • Garments Factory</small>
  </div>
  <img id="logo" class="logo" src="logo.jpg" alt="Logo" onerror="this.style.display='none'">
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <button class="nav active" data-page="dashboard">🏠 Dashboard</button>
    <button class="nav" data-page="employees">👥 Employees</button>
    <button class="nav" data-page="attendance">🕘 Attendance</button>
    <button class="nav" data-page="salary">💰 Salary Report</button>
    <button class="nav" data-page="stock">📦 Store / Stock</button>
    <button class="nav" data-page="reports">📊 Reports</button>
    <button class="nav" data-page="register">📷 Register Scanner</button>
    <div class="side-bottom">
      <button id="backupBtn" class="nav">⬇️ Backup</button>
      <label class="nav file-nav">⬆️ Restore<input id="restoreFile" type="file" accept=".json"></label>
    </div>
  </aside>

  <main id="main" class="main"></main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button id="modalClose" class="modal-close">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
